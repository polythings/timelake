# Dependabot keeps every dependency current: one pull request a week per ecosystem with its minor and patch
# updates, and one per major update. Security updates don't wait for the schedule. See CONTRIBUTING.md,
# "Dependencies".
#
# A new version is proposed once it's 7 days old (security updates at once): most compromised releases are
# found and pulled within days.
#
# The lockfiles pin exact versions. Version ranges in pyproject.toml and package.json change only when a new version
# falls outside them (increase-if-necessary), so the packages don't demand newer versions than they need.
version: 2

updates:
  # Actions are pinned to commits. release.yml is generated by dist: after Dependabot updates it, run
  # scripts/sync_dist_pins.py on the pull request (CI says so).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { update-types: [minor, patch] }

  - package-ecosystem: cargo
    directories: [/, /crates/timelake-wasm, /bench/rust-reader]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      cargo: { update-types: [minor, patch] }
    ignore:
      # iceberg (pinned with =) fixes the Arrow, Parquet and Avro versions; DataFusion, object_store and PyO3 (through
      # arrow-pyarrow, with pythonize) follow Arrow. Dependabot proposes iceberg itself: move these with it, by hand.
      # Before 1.0 a minor version (0.13 → 0.14) is breaking.
      - { dependency-name: "arrow*", update-types: [version-update:semver-major] }
      - { dependency-name: "parquet", update-types: [version-update:semver-major] }
      - { dependency-name: "datafusion*", update-types: [version-update:semver-major] }
      - { dependency-name: "object_store", update-types: [version-update:semver-major, version-update:semver-minor] }
      - { dependency-name: "apache-avro", update-types: [version-update:semver-major, version-update:semver-minor] }
      - { dependency-name: "pyo3", update-types: [version-update:semver-major, version-update:semver-minor] }
      - { dependency-name: "pythonize", update-types: [version-update:semver-major, version-update:semver-minor] }

  # The WASM crate's toolchain is the root one plus its target: one pull request updates both.
  - package-ecosystem: rust-toolchain
    directories: [/, /crates/timelake-wasm]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      rust-toolchain: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    versioning-strategy: increase-if-necessary
    cooldown: { default-days: 7 }
    groups:
      python: { update-types: [minor, patch] }
    ignore:
      # Lance's DataFusion table provider (pylance 13) is built for DataFusion 54: move them together, by hand.
      - { dependency-name: "datafusion", update-types: [version-update:semver-major] }

  - package-ecosystem: bun
    directories: [/, /brand]
    schedule: { interval: weekly }
    versioning-strategy: increase-if-necessary
    cooldown: { default-days: 7 }
    groups:
      javascript: { update-types: [minor, patch] }
    ignore:
      # The logo lockup (brand/lockup.mjs) is outlined from Geist 1.3.1; newer Geists have different letter shapes.
      - dependency-name: geist
      # The types match the Node.js that runs the website (Vercel's default, 24), not the newest Node.js.
      - { dependency-name: "@types/node", update-types: [version-update:semver-major] }

  - package-ecosystem: gomod
    directory: /bench/tools/s3proxy
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      go: { update-types: [minor, patch] }
