# The weekly regression benchmark (spec 32) on a fixed instance in us-east-2, at the newest commit on main.
# "start" starts the instance and a run: bench/profiles/weekly.toml on Mondays, iiot.toml (industrial IoT) on
# Thursdays; the instance stops itself when done. "collect" (hourly, Monday to Friday) commits finished run files to
# bench/results/runs and the website's copy, so the history on timelake.dev/benchmarks grows each week.
# Setup: bench/infra/README.md, "Weekly runs".
name: Weekly benchmark

on:
  schedule:
    - cron: "0 6 * * 1" # start weekly: Mondays 06:00 UTC
    - cron: "0 6 * * 4" # start iiot: Thursdays 06:00 UTC
    - cron: "30 * * * 1-5" # collect: hourly, Monday to Friday
  workflow_dispatch:
    inputs:
      action:
        description: start a run, or collect finished ones
        type: choice
        options: [start, collect]
        default: start
      profile:
        description: the profile a start runs (bench/profiles)
        type: choice
        options: [weekly, iiot]
        default: weekly

permissions:
  contents: write # commit the results
  id-token: write # assume the benchmark role in AWS

concurrency:
  group: bench-weekly
  cancel-in-progress: false

env:
  STACK: timelake-bench-weekly

jobs:
  start:
    name: Start the run
    if: >-
      vars.BENCH_ROLE_ARN != '' &&
      (github.event.schedule == '0 6 * * 1' || github.event.schedule == '0 6 * * 4' || inputs.action == 'start')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BENCH_ROLE_ARN }}
          aws-region: us-east-2
      - run: bench/infra/weekly.sh start "$GITHUB_SHA" "$PROFILE"
        env:
          PROFILE: ${{ github.event.schedule == '0 6 * * 4' && 'iiot' || inputs.profile || 'weekly' }}

  collect:
    name: Commit finished runs
    if: vars.BENCH_ROLE_ARN != '' && (github.event.schedule == '30 * * * 1-5' || inputs.action == 'collect')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.BENCH_ROLE_ARN }}
          aws-region: us-east-2
      - run: bench/infra/weekly.sh collect
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: dashboard/package.json
      - run: bun dashboard/scripts/sync-results.ts
      - name: Commit the run files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results/runs dashboard/data
          git diff --cached --quiet && { echo "no new runs"; exit 0; }
          git commit -m "Bench: weekly runs of $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
