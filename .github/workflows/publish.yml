# Publishes the packages when scripts/release.py pushes its tag (vX.Y.Z):
#   crates.io  timelake-format, timelake, timelake-cli
#   PyPI       timelake (wheels for Linux, macOS and Windows, and the source distribution)
#   npm        @timelake/client
# The CLI binaries, installers and the GitHub release come from release.yml, which dist generates.
# Every registry uses trusted publishing: the job proves it is this workflow in this repository with a
# short-lived OIDC token, so no registry token is stored anywhere. See CONTRIBUTING.md, "Versions and releases".
#
# Run it by hand (Actions → Publish → Run workflow) to build everything and dry-run each publish; a manual run
# doesn't use the registries' environments, so it needs no approval.
# Publishing is idempotent: a version a registry already has is skipped, so a failed run can be re-run.
# No build caches: a release is built from a clean checkout, so a poisoned cache can't end up in it.
name: Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A tag push publishes; a manual run only builds and dry-runs.
  DRY_RUN: ${{ github.event_name != 'push' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Every package has the tag's version
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($version)"
            exit 1
          fi
          # Every file scripts/release.py sets the version in.
          for file in crates/timelake-wasm/Cargo.toml crates/timelake-py/pyproject.toml; do
            grep -q "^version = \"$version\"" "$file" || { echo "::error::$file isn't at $version"; exit 1; }
          done
          for file in packages/timelake-client/package.json dashboard/package.json; do
            grep -q "\"version\": \"$version\"" "$file" || { echo "::error::$file isn't at $version"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    # A tag publishes only a commit CI passed on. scripts/release.py pushes main, waits for CI, then pushes the tag;
    # this checks it here too, for a tag pushed some other way. Builds don't wait for it, only the publishes.
    name: CI passed on the tagged commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          for _ in $(seq 120); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push \
              --json status,conclusion,url --jq '.[0] // empty')
            if [ -n "$run" ] && [ "$(jq -r .status <<< "$run")" = completed ]; then
              conclusion=$(jq -r .conclusion <<< "$run")
              [ "$conclusion" = success ] && exit 0
              echo "::error::CI on $GITHUB_SHA concluded $conclusion: $(jq -r .url <<< "$run")"
              exit 1
            fi
            sleep 30
          done
          echo "::error::no finished CI run on $GITHUB_SHA after an hour (push the commit to main first)"
          exit 1

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: macos-x86_64, runner: macos-15, target: x86_64-apple-darwin }
          - { name: windows-x86_64, runner: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --profile dist --locked --out dist -m crates/timelake-py/Cargo.toml
      - name: Wheel fits PyPI's 100 MB file limit
        shell: bash
        run: |
          ls -l dist
          if [ -n "$(find dist -name '*.whl' -size +95M)" ]; then echo "::error::wheel over 95 MB"; exit 1; fi
      - name: Smoke test
        # The x86_64 macOS wheel is cross-compiled on an arm64 runner and can't be imported there.
        if: matrix.name != 'macos-x86_64'
        shell: bash
        run: |
          python -m pip install pyarrow
          python -m pip install --no-index --find-links dist timelake
          python -c "import tempfile, timelake; lake = timelake.Lake(tempfile.mkdtemp()); print(timelake.__name__, lake.tables())"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist -m crates/timelake-py/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  npm-package:
    name: npm package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: dashboard/package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      # The embedded WASM must match its sources: the release script rebuilt it before tagging.
      - run: bun run check:wasm
        working-directory: packages/timelake-client
      # npm pack runs the package's prepack script, which builds dist/.
      - run: mkdir -p "$RUNNER_TEMP/npm" && npm pack --pack-destination "$RUNNER_TEMP/npm"
        working-directory: packages/timelake-client
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/*.tgz

  # --- Publishing: only once every build above has succeeded, so no registry gets a partial release. ---

  pypi:
    name: Publish to PyPI
    needs: [version, wheels, sdist, npm-package, ci]
    # A manual run skips the CI check and only dry-runs.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || '' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - if: env.DRY_RUN == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  crates:
    name: Publish to crates.io
    needs: [version, wheels, sdist, npm-package, ci]
    # A manual run skips the CI check and only dry-runs.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'crates-io' || '' }}
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: published
        name: Already on crates.io?
        run: |
          # Each crate on its own: a run that failed partway published some of them.
          missing=""
          for crate in timelake-format timelake timelake-cli; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'timelake release workflow (github.com/polythings/timelake)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case $status in
              200) echo "$crate $VERSION is on crates.io already" ;;
              404) missing="$missing $crate" ;;
              *) echo "::error::crates.io answered $status for $crate $VERSION"; exit 1 ;;
            esac
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
      - if: env.DRY_RUN == 'true'
        run: cargo publish --dry-run --locked -p timelake-format -p timelake -p timelake-cli
      - if: env.DRY_RUN == 'false' && steps.published.outputs.missing != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: env.DRY_RUN == 'false' && steps.published.outputs.missing != ''
        run: |
          read -ra crates <<< "$MISSING"
          cargo publish --locked "${crates[@]/#/--package=}"
        env:
          MISSING: ${{ steps.published.outputs.missing }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    name: Publish to npm
    needs: [version, wheels, sdist, npm-package, ci]
    # A manual run skips the CI check and only dry-runs.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: npm supports trusted publishing (11.5.1 or later)
        run: npx --yes semver@7.7.2 --range '>=11.5.1' "$(npm --version)"
      - id: published
        name: Already on npm?
        run: echo "published=$(npm view "@timelake/client@$VERSION" version > /dev/null 2>&1 && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: env.DRY_RUN == 'true'
        run: npm publish ./package/*.tgz --dry-run
      # Provenance is added automatically: the repository and package are public.
      - if: env.DRY_RUN == 'false' && steps.published.outputs.published == 'false'
        run: npm publish ./package/*.tgz
