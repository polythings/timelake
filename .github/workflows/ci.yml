# Checks every push to main and every pull request. Needs no secrets.
# Vercel builds and deploys the website separately, on every push to main (dashboard/vercel.json turns off previews).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push replaces its older run. Every commit to main gets its own run, never cancelled: a release
# tag is only published once CI passed on its commit (publish.yml), and a concurrency group would also cancel pending
# runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (engine, CLI, Python bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: rustup toolchain install   # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: WASM reader
    runs-on: ubuntu-latest
    env:
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: rustup toolchain install   # from rust-toolchain.toml
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/timelake-wasm
      - run: cargo fmt --manifest-path crates/timelake-wasm/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/timelake-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --manifest-path crates/timelake-wasm/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/timelake-wasm/Cargo.toml

  python:
    name: Python (package and benchmarks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: rustup toolchain install   # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: uv sync --locked
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ty check
      - run: uv run --no-sync pytest crates/timelake-py/tests
      - run: uv run --no-sync pytest bench/tests

  web:
    name: TypeScript (website and client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: dashboard/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - name: Embedded WASM matches its sources
        run: bun run --cwd packages/timelake-client check:wasm
      - run: bun test scripts
      - name: Website runs match bench/results/runs
        run: bun dashboard/scripts/sync-results.ts && git diff --exit-code dashboard/data/runs
      # Vercel builds the site on every push; build it here too, so a change that breaks it fails CI.
      - name: Website builds
        run: bun run --cwd dashboard build

  client:
    name: TypeScript client vs the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: dashboard/package.json
      - run: rustup toolchain install   # from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build -p timelake-cli
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/timelake-client

  go:
    name: Go (s3proxy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/tools/s3proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bench/tools/s3proxy/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  bench-reader:
    # Its own workspace (Vortex needs a newer DataFusion than the engine's); run.py's datafusion-rs engines use it.
    name: Rust benchmark reader (bench/rust-reader)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench/rust-reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install   # from bench/rust-reader/rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: bench/rust-reader
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  release:
    name: Release workflow matches dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install   # from rust-toolchain.toml
      - name: Install dist
        run: |
          version=$(sed -nE 's/^cargo-dist-version = "([^"]+)"/\1/p' dist-workspace.toml)
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$version/cargo-dist-installer.sh" | sh
      # dist won't release if release.yml differs from what it generates. Dependabot updates the actions in
      # release.yml; scripts/sync_dist_pins.py copies them into dist-workspace.toml.
      - name: release.yml is what dist generates from dist-workspace.toml
        run: |
          dist generate --mode ci --check || {
            echo "::error::release.yml is out of date: run 'uv run python scripts/sync_dist_pins.py' and commit"
            exit 1
          }
