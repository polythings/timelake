# Git hooks, run by prek (https://prek.j178.dev): `uv tool install prek && prek install --install-hooks`.
# On commit: formatters and fast linters on the staged files. On push: clippy and the type checkers.
# Everything: `prek run --all-files --hook-stage pre-push`. CI runs the same checks plus the tests.
default_install_hook_types: [pre-commit, pre-push]
exclude: ^(bench/results/|dashboard/data/|dashboard/lab-lake/|packages/timelake-client/src/wasm/|brand/explorations/|.*/tests/fixtures/)

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      # Rust
      - id: rustfmt
        name: rustfmt
        entry: rustfmt --edition 2024
        language: system
        types: [rust]
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets --quiet -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: clippy-wasm
        name: clippy (timelake-wasm)
        entry: bash -c 'cd crates/timelake-wasm && cargo clippy --target wasm32-unknown-unknown --quiet -- -D warnings && cargo clippy --all-targets --quiet -- -D warnings'
        language: system
        files: ^crates/timelake-(wasm|format)/
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: wasm-bundle
        name: embedded WASM matches its sources
        entry: bash -c 'cd packages/timelake-client && bun run check:wasm'
        language: system
        files: ^(crates/timelake-(wasm|format)/|packages/timelake-client/src/wasm/)
        pass_filenames: false
        stages: [pre-push]

      # Specs: the index in spec/README.md and the website's list follow each spec's front matter.
      - id: spec-index
        name: spec index
        entry: uv run --no-sync python scripts/spec_index.py --check
        language: system
        files: ^(spec/|scripts/spec_index\.py|dashboard/lib/spec)
        pass_filenames: false

      # Python
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty
        entry: uv run --no-sync ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-push]

      # TypeScript and JavaScript
      - id: oxfmt
        name: oxfmt
        entry: bunx oxfmt --no-error-on-unmatched-pattern
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
      - id: oxlint
        name: oxlint
        entry: bunx oxlint --deny-warnings
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: tsc
        name: tsc
        entry: bun run typecheck
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
        stages: [pre-push]

      # Go
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: bash -c 'cd bench/tools/s3proxy && go vet ./...'
        language: system
        types: [go]
        pass_filenames: false
