# uv workspace: the Python package (crates/timelake-py) and the benchmarks (bench).
# `uv sync` builds the package with maturin and installs everything into ./.venv.
[tool.uv.workspace]
members = ["bench", "crates/timelake-py"]

[dependency-groups]
dev = ["ruff>=0.17.1", "ty>=0.0.90", "pytest>=8", "duckdb>=1.5", "polars>=1.30"]

[tool.ruff]
line-length = 120
target-version = "py310"                              # the package supports Python 3.10+
extend-exclude = ["bench/data", "**/target", "*.md", ".claude"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "ANN", "D", "C4", "C90", "PIE", "RET",
    "PERF", "FURB", "PL", "PT", "S", "BLE", "ARG", "DTZ", "ERA", "TC",
]
ignore = [
    "D105", "D107",                                   # docstrings on magic methods and __init__
    "PLR2004",                                        # magic values in comparisons
    "COM812", "ISC001",                               # conflict with the formatter
]
allowed-confusables = ["×", "÷", "—", "–"]            # intentional in report output

[tool.ruff.lint.per-file-ignores]
"bench/**" = ["T201", "S608", "S603", "S607", "PLC0415"]   # CLI scripts: printing, constant SQL, subprocesses, lazy engine imports
"**/tests/**" = ["S101", "D", "ANN201", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["timelake", "timebench"]          # the package and the benchmarks' shared code

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["bench/v0"]                            # bench/tests import the v0 scripts (as pytest does)

[tool.ty.src]
exclude = ["bench/data", "**/target", ".claude"]
