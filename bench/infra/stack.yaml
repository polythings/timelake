AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  timelake-bench (spec 44): an S3 Standard bucket, an S3 Express One Zone bucket and an S3 Tables table bucket,
  plus (Instance=true) one benchmark instance in the same zone. Access via SSM only (no SSH, no inbound ports).
  The instance stops itself after AutoStopMinutes. Delete with bench/infra/down.sh. With GitHubSubject set (the
  weekly stack, bench/infra/weekly.sh), a role GitHub Actions of that repository's main branch can assume to start
  the instance, run the weekly benchmark on it and read its results.

Parameters:
  Instance:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create the benchmark instance (false = buckets only, for runs from a laptop).
  VpcId:
    Type: String
    Default: ""
  SubnetId:
    Type: String
    Default: ""
    Description: A subnet in AzId with a route to the internet (the default VPC's subnet).
  AzId:
    Type: String
    Default: use2-az1
  InstanceType:
    Type: String
    Default: m7i-flex.large
    Description: >-
      The Free plan allows only small types (m7i-flex.large: 2 vCPU, 8 GB). With the Paid plan, c8gd.2xlarge
      (Graviton, 8 vCPU, local NVMe) together with the arm64 ImageId is closer to the Phase 0 laptop.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  RepoRef:
    Type: String
    Default: ""
    Description: Git commit of github.com/polythings/timelake to check out on the instance.
  AutoStopMinutes:
    Type: Number
    Default: 720
  GitHubSubject:
    Type: String
    Default: ""
    Description: >-
      The OIDC subject prefix of the repository whose main branch may run the weekly benchmark, as GitHub sends it
      (repo:owner/name, or repo:owner@id/name@id with immutable subjects; up.sh looks it up). Empty = no role.
  GitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      The account's existing OIDC provider for token.actions.githubusercontent.com, if it has one (an account can
      have only one per URL); empty = the stack creates it.

Conditions:
  WithInstance: !Equals [!Ref Instance, "true"]
  WithGitHub: !And [!Condition WithInstance, !Not [!Equals [!Ref GitHubSubject, ""]]]
  CreateOidcProvider: !And [!Condition WithGitHub, !Equals [!Ref GitHubOidcProviderArn, ""]]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ExpressBucket:
    Type: AWS::S3Express::DirectoryBucket
    Properties:
      DataRedundancy: SingleAvailabilityZone
      LocationName: !Ref AzId

  TableBucket:
    Type: AWS::S3Tables::TableBucket
    Properties:
      TableBucketName: !Sub "${AWS::StackName}-${AWS::AccountId}"

  Role:
    Type: AWS::IAM::Role
    Condition: WithInstance
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: bench-buckets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:*
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub "${DataBucket.Arn}/*"
              - Effect: Allow
                Action: s3express:*
                Resource: !GetAtt ExpressBucket.Arn
              - Effect: Allow
                Action: s3tables:*
                Resource:
                  - !GetAtt TableBucket.TableBucketARN
                  - !Sub "${TableBucket.TableBucketARN}/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: WithInstance
    Properties:
      Roles: [!Ref Role]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: WithInstance
    Properties:
      GroupDescription: timelake-bench, outbound only
      VpcId: !Ref VpcId

  BenchInstance:
    Type: AWS::EC2::Instance
    Condition: WithInstance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref SecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      InstanceInitiatedShutdownBehavior: stop
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 100, DeleteOnTermination: true }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          shutdown -h +${AutoStopMinutes}
          cat > /etc/profile.d/timelake-bench.sh <<EOF
          export AWS_REGION=${AWS::Region}
          export BENCH_DATA_BUCKET=${DataBucket}
          export BENCH_EXPRESS_BUCKET=${ExpressBucket}
          export BENCH_MACHINE=${InstanceType}
          EOF
          curl -fsSL https://raw.githubusercontent.com/polythings/timelake/${RepoRef}/bench/infra/bootstrap.sh \
            | bash -s ${RepoRef} > /var/log/timelake-bootstrap.log 2>&1

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubRole:
    Type: AWS::IAM::Role
    Condition: WithGitHub
    Properties:
      Description: Weekly benchmark from GitHub Actions (bench/infra/weekly.sh)
      MaxSessionDuration: 21600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref GitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "${GitHubSubject}:ref:refs/heads/main"
      Policies:
        - PolicyName: weekly-benchmark
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId
              - Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${BenchInstance}"
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeInstanceStatus, ssm:DescribeInstanceInformation, ssm:GetCommandInvocation]
                Resource: "*"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${BenchInstance}"
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "_out/*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/_out/*"

Outputs:
  InstanceId:
    Condition: WithInstance
    Value: !Ref BenchInstance
  DataBucket:
    Value: !Ref DataBucket
  ExpressBucket:
    Value: !Ref ExpressBucket
  TableBucketArn:
    Value: !GetAtt TableBucket.TableBucketARN
  GitHubRoleArn:
    Condition: WithGitHub
    Value: !GetAtt GitHubRole.Arn
