# The industrial IoT workload (spec 45) on the benchmark instance, every Thursday: every system on the instance's
# disk, the database servers in Docker (infra/servers.sh). By hand: `bench/infra/weekly.sh start <commit> iiot`.
label = "iiot"
runs = 2
timeout = 180               # seconds per query (first run and repeats); the slowest answers take under 2 minutes
pace = 1                    # the live day: one 5-minute window per second
live_interval = 15          # fresh readers probe each system every 15 s while it ingests live
concurrency = [1, 4, 16]
concurrency_seconds = 30

[[run]]
workload = "iiot"
scale = "small"
target = "local"
systems = [
  "reference",
  "timelake",
  "timescaledb",
  "clickhouse",
  "questdb",
  "influxdb3",
  "influxdb3-defaults",
  "iceberg",
  "lance",
  "parquet",
]
