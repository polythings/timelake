[package]
name = "bench-reader"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Separate workspace: Vortex is pinned exactly (=0.88) with the DataFusion it needs, apart from Timelake's dependencies.
[workspace]

[dependencies]
vortex = { version = "=0.88.0", features = ["tokio"] }
vortex-datafusion = "=0.88.0"
datafusion = "55"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
url = "2"
object_store = { version = "0.13", features = ["aws"] }

[profile.release]
debug = false
