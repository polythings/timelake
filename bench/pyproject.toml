[project]
name = "timebench"
version = "0.0.0"
description = "Benchmarks for Timelake (spec 32)"
requires-python = ">=3.12"
dependencies = [
    "timelake",
    "duckdb>=1.5",
    "datafusion>=54,<55",                      # pylance 13 (Lance's DataFusion table provider) is built for 54
    "polars>=1.30",
    "pyarrow>=20",
    "numpy>=2",
    "pyiceberg[sql-sqlite,pyarrow,pyiceberg-core]>=0.10",
    "pytz",                                    # DuckDB needs it to return timestamptz values to Python
    "pylance>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "boto3>=1.43.112",
    "clickhouse-connect>=1.10.1",
    "questdb[dataframe]>=5.0.0",
    "botocore[crt]>=1.43.112",
]

[project.scripts]
timebench = "timebench.cli:main"

# The scripts stay plain files (python run.py, python v0/small.py, ...); the code they share is the
# `timebench` package next to them, installed editable by `uv sync`.
[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "timebench"
module-root = ""

[tool.uv.sources]
timelake = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
