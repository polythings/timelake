[workspace]
resolver = "2"
members = ["crates/timelake-format", "crates/timelake", "crates/timelake-cli", "crates/timelake-py"]
# Built for wasm32 with its own release profile and target settings (see its .cargo/config.toml).
exclude = ["crates/timelake-wasm"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/polythings/timelake"
homepage = "https://timelake.dev"

[workspace.dependencies]
# The published crates depend on each other by version too; scripts/release.py keeps these in step.
timelake = { path = "crates/timelake", version = "0.7.0" }
timelake-format = { path = "crates/timelake-format", version = "0.7.0" }
# Iceberg metadata, manifests and commits without I/O of their own (github.com/polythings/lakekit), shared with the
# WASM reader and writer.
lakekit-core = "0.1"
lakekit-iceberg = { version = "0.1", default-features = false }
# iceberg 0.10.1 is on Arrow 58, so DataFusion 54.x (Arrow 58, object_store 0.13) is the newest matching engine.
iceberg = "=0.10.1"
datafusion = "54.1"
arrow = { version = "58", features = ["prettyprint", "ipc_compression"] }
parquet = { version = "58", features = ["async", "object_store"] }
object_store = { version = "0.13.2", features = ["aws", "gcp", "azure", "http"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
blake3 = "1.8"
async-trait = "0.1"
typetag = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
url = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
pyo3 = { version = "0.28", features = ["abi3-py310"] }
arrow-pyarrow = "58.4"
arrow-array = { version = "58.4", features = ["ffi"] }
thiserror = "2"
chrono = "0.4"
rand = "0.10"
tempfile = "3"

# Until lakekit 0.1.0 is on crates.io (polythings/lakekit#7). To work on both, point these at a local checkout.
[patch.crates-io]
lakekit-core = { git = "https://github.com/polythings/lakekit", rev = "a5db84b2fd591d591d20d3047055983a2274bdbb" }
lakekit-iceberg = { git = "https://github.com/polythings/lakekit", rev = "a5db84b2fd591d591d20d3047055983a2274bdbb" }

[profile.release]
debug = "line-tables-only"

# What users download (wheels, CLI binaries; .github/workflows/release.yml). Without debug info: line tables alone
# made the Linux builds 160 MB, over PyPI's 100 MB limit. Symbol names stay, so panics still name functions.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"
lto = "thin"

# Dependencies (DataFusion, Arrow, …) are huge with full debug info; keep it for our own crates only.
[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Too noisy for this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
cast_precision_loss = "allow"
# A few restriction lints worth having.
allow_attributes = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
