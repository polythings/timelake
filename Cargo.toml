[workspace]
resolver = "2"
members = ["crates/timelake-format", "crates/timelake", "crates/timelake-cli", "crates/timelake-py"]
# Built for wasm32 with its own release profile and target settings (see its .cargo/config.toml).
exclude = ["crates/timelake-wasm"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/polythings/timelake"
homepage = "https://timelake.dev"

[workspace.dependencies]
# The published crates depend on each other by version too; scripts/release.py keeps these in step.
timelake = { path = "crates/timelake", version = "0.7.0" }
timelake-format = { path = "crates/timelake-format", version = "0.7.0" }
# Arrow follows the newest DataFusion (spec 47, #193). No iceberg-rust release is on Arrow 59 yet, so this is our fork:
# iceberg 0.10.1 with only its Arrow version raised (github.com/polythings/iceberg-rust), library name `iceberg`.
iceberg = { package = "polythings-iceberg", version = "0.59.0", git = "https://github.com/polythings/iceberg-rust", rev = "f2a9c27715efeddaf92f697216c49c157a215a02" }
datafusion = "55.2"
arrow = { version = "59.3", features = ["prettyprint", "ipc_compression"] }
parquet = { version = "59.3", features = ["async", "object_store"] }
object_store = { version = "0.13.2", features = ["aws", "gcp", "azure", "http"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
blake3 = "1.8"
async-trait = "0.1"
typetag = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
url = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# Moves with PyO3: its minor version names the PyO3 it serves.
pythonize = "0.29"
arrow-pyarrow = "59.3"
arrow-array = { version = "59.3", features = ["ffi"] }
thiserror = "2"
chrono = "0.4"
rand = "0.10"
tempfile = "3"

[profile.release]
debug = "line-tables-only"

# What users download (wheels, CLI binaries; .github/workflows/release.yml). Without debug info: line tables alone
# made the Linux builds 160 MB, over PyPI's 100 MB limit. Symbol names stay, so panics still name functions.
[profile.dist]
inherits = "release"
debug = false
strip = "debuginfo"
lto = "thin"

# Dependencies (DataFusion, Arrow, …) are huge with full debug info; keep it for our own crates only.
[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Too noisy for this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
cast_precision_loss = "allow"
# A few restriction lints worth having.
allow_attributes = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
