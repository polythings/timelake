[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "timelake"
version = "0.7.0"
description = "The open time-series lakehouse: fast queries on your own object storage, with no database and no maintenance jobs"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["pyarrow>=14"]

[project.urls]
Homepage = "https://timelake.dev"
Documentation = "https://timelake.dev/docs/python"
Repository = "https://github.com/polythings/timelake"

[tool.maturin]
python-source = "python"
module-name = "timelake._timelake"

[dependency-groups]
test = ["pytest>=8", "duckdb>=1.5", "polars>=1.30"]

[tool.uv]
# Rebuild the native module when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../timelake/src/**/*.rs" },
    { file = "../timelake-format/src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access (deselect with -m 'not network')"]
