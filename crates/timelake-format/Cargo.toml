[package]
name = "timelake-format"
description = "Timelake's table conventions and write path without I/O, shared by the engine and the WebAssembly reader and writer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["time-series", "iceberg", "lakehouse"]
categories = ["database-implementations"]

[features]
# The head object's container and codecs (Arrow IPC and JSON), for the engine and the WASM reader.
head = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-json", "dep:arrow-schema", "dep:arrow-select", "dep:serde", "dep:serde_json"]
# Writing tables without I/O of its own, shared by the engine and the WASM writer: rows, Parquet files with their
# Iceberg statistics, manifests and metadata, appends and commits over a `Host`, and the streaming merge of compaction.
write = [
    "dep:arrow-arith",
    "dep:arrow-array",
    "dep:arrow-cast",
    "dep:arrow-ord",
    "dep:arrow-row",
    "dep:arrow-schema",
    "dep:arrow-select",
    "dep:parquet",
    "dep:apache-avro",
    "dep:serde_json",
    "dep:bytes",
    "dep:futures-util",
    "head",
]

[dependencies]
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
apache-avro = { version = "0.21", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
arrow-arith = { version = "58", optional = true }
arrow-array = { version = "58", optional = true }
arrow-cast = { version = "58", optional = true }
arrow-ipc = { version = "58", default-features = false, features = ["zstd"], optional = true }
arrow-json = { version = "58", optional = true }
arrow-ord = { version = "58", optional = true }
arrow-row = { version = "58", optional = true }
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"], optional = true }
arrow-schema = { version = "58", features = ["serde"], optional = true }
arrow-select = { version = "58", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"

[dev-dependencies]
bytes = "1"
futures-executor = "0.3"

[lints]
workspace = true
